<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Usuários - JSON-Server</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h2>👤 Cadastro de Usuário</h2>

    <!-- Campo oculto para guardar o ID quando estiver editando -->
    <input type="hidden" id="usuarioId">

    <div class="form-group">
      <label>Nome Completo:</label>
      <input type="text" id="nome" placeholder="Ex: Maria Souza">
    </div>

    <div class="form-group">
      <label>E-mail:</label>
      <input type="email" id="email" placeholder="Ex: maria@email.com">
    </div>

    <div class="form-group">
      <label>CPF:</label>
      <input type="text" id="cpf" placeholder="000.000.000-00">
    </div>

    <div class="form-group">
  <label>CEP:</label>
  <!-- Evento onblur dispara a busca assim que o usuário sai do campo -->
  <input type="text" id="cep" placeholder="00000-000" maxlength="9">
</div>

<div class="form-group">
  <label>Rua:</label>
  <input type="text" id="rua" placeholder="Rua / Avenida" readonly>
</div>

<div class="form-group">
  <label>Bairro:</label>
  <input type="text" id="bairro" placeholder="Bairro" readonly>
</div>

<div class="form-group">
  <label>Cidade / UF:</label>
  <input type="text" id="cidadeUf" placeholder="Cidade - UF" readonly>
</div>

    <div class="botoes">
      <button id="btnSalvar">Salvar Usuário</button>
      <button id="btnCancelar" class="btn-secundario" style="display: none;">Cancelar Edição</button>
    </div>

    <hr>

    <h3>📋 Usuários Cadastrados</h3>
    <table id="tabelaUsuarios">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>CPF</th>
          <th>CEP</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <!-- Os dados do JSON-Server serão inseridos aqui dinamicamente -->
      </tbody>
    </table>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
