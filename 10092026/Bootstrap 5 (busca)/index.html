<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1ESSRA - Paginação via API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <div class="container my-5">
        <div class="card bg-secondary text-white shadow-lg border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h3 class="mb-0">👥 Gestão de Usuários (API REST)</h3>
                <span id="badgeTotal" class="badge bg-light text-dark fs-6">0 registros</span>
            </div>
            
            <div class="card-body">
                <!-- Filtros e Seletor de Paginação -->
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <input type="text" id="inputBusca" class="form-control bg-dark text-light border-secondary" placeholder="🔍 Filtrar por nome, e-mail ou cargo...">
                    </div>
                    <div class="col-md-3">
                        <select id="selectItensPagina" class="form-select bg-dark text-light border-secondary">
                            <option value="5">Exibir 5 por página</option>
                            <option value="10" selected>Exibir 10 por página</option>
                            <option value="50">Exibir 50 por página</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button id="btnRecarregar" class="btn btn-outline-info w-100">🔄 Recarregar API</button>
                    </div>
                </div>

                <!-- Status de Carregamento -->
                <div id="status" class="alert alert-info d-none" role="alert"></div>

                <!-- Tabela -->
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle border-secondary">
                        <thead>
                            <tr class="table-active">
                                <th>Foto</th>
                                <th>Nome Completo</th>
                                <th>E-mail</th>
                                <th>Cargo</th>
                                <th>Idade</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo"></tbody>
                    </table>
                </div>

                <!-- Controles de Paginação (Bootstrap Pagination) -->
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span id="infoPagina" class="text-light small">Página 1 de 1</span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" id="itemAnterior">
                                <button class="page-item btn btn-outline-light btn-sm me-1" id="btnAnterior">Anterior</button>
                            </li>
                            <li class="page-item" id="itemProximo">
                                <button class="page-item btn btn-outline-light btn-sm" id="btnProximo">Próximo</button>
                            </li>
                        </ul>
                    </nav>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
