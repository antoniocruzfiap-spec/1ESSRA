<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diferença entre GET e POST</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #0f172a; color: #fff; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 400px; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <!-- Mude de "GET" para "POST" aqui para demonstrar para a turma -->
        <form action="" method="POST">
            <h3>Testando Método do Formulário</h3>
            
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

            <button type="submit">Enviar Dados</button>
        </form>
    </div>

</body>
</html>
